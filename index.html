<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Docks - Real Estate & Property Listings India</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Preload Hero Banner Image for instant initial home page paint -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=1920&q=80" fetchpriority="high">
    <!-- Premium CSS -->
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem("property_docs_active_theme");
            const theme = (savedTheme === "property_docs" || savedTheme === "property-docs-light") ? savedTheme : "property-docs-light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <!-- Scripts Injection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
